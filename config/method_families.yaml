families:
- id: on-policy-distillation
  title: On-Policy Distillation
  color: '#3157D5'
  description: Distill teacher or self-teacher signals on states generated by the student policy.
  directions: [distillation]
  transfer_ideas:
  - Turn-level or step-level guidance may expose better credit signals for long-horizon agents.
  - Reliability-aware teacher filtering could reduce harmful imitation in reasoning and multimodal settings.
- id: rlvr-grpo
  title: RL Optimization & Verifiable Rewards
  color: '#7C3AED'
  description: Optimize sampled policies with learned or programmatic rewards, including group-relative and verifier-based signals.
  directions: [reinforcement-learning, reward-verifiers]
  transfer_ideas:
  - Group-relative normalization may reduce reward-scale dependence when moving between tasks.
  - Verifier design and policy optimization can be separated to test whether gains come from the signal or the optimizer.
- id: preference-optimization
  title: Preference Optimization
  color: '#DB2777'
  description: Change model behavior using pairwise, scalar, human, or AI preference signals without requiring the same online loop.
  directions: [preference-alignment]
  transfer_ideas:
  - Reference-free objectives may reduce serving and training complexity, but need stronger distribution-shift checks.
  - Preference signals can be combined with verifiers when scalar quality is easier to check than to rank.
- id: reasoning-self-improvement
  title: Reasoning & Self-Improvement
  color: '#059669'
  description: Convert generated reasoning, critique, self-reward, or self-play into additional learning signal.
  directions: [reasoning-self-improvement]
  transfer_ideas:
  - Self-generated traces should be filtered by a measurable correctness or uncertainty signal before reuse.
  - Delayed self-feedback may be useful for agents, but requires controls for reward hacking and confirmation bias.
- id: agentic-feedback
  title: Agentic Feedback & Tool Use
  color: '#D97706'
  description: Train models with tools, browsers, environments, or multi-step interaction rather than isolated responses.
  directions: [agentic]
  transfer_ideas:
  - Tool-use traces can provide structured intermediate supervision for reasoning models.
  - Environment-generated feedback may complement static preference data when failures are observable.
- id: multimodal-alignment
  title: Multimodal Alignment
  color: '#0891B2'
  description: Adapt or align perception-language systems with instruction, preference, reward, or cross-modal feedback.
  directions: [multimodal]
  transfer_ideas:
  - Text-side preference objectives may miss visual grounding failures; pair them with modality-specific checks.
  - Data curation and feedback granularity should be ablated separately when scaling alignment to new modalities.
- id: generative-alignment
  title: Generative Media Alignment
  color: '#EA580C'
  description: Align diffusion, image, video, or other generators with rewards, preferences, and task-specific feedback.
  directions: [generative-media]
  transfer_ideas:
  - Preference optimization can be tested against reward-guided updates under matched compute and sampling budgets.
  - Human preference signals may need content-specific evaluators to avoid improving aesthetics while harming faithfulness.
- id: embodied-transfer
  title: Embodied & VLA Transfer
  color: '#4F46E5'
  description: Transfer web or language knowledge into grounded action and control through multimodal post-training.
  directions: [embodied-vla]
  transfer_ideas:
  - Language-side reasoning traces may help with action planning only when grounding and latency are controlled.
  - Distillation and interactive feedback offer complementary routes for improving long-horizon control.
- id: data-feedback
  title: Data & Feedback Construction
  color: '#64748B'
  description: Improve post-training by constructing, selecting, scaling, or supervising the data and feedback loop itself.
  directions: [supervised-adaptation]
  transfer_ideas:
  - Better data selection can be more valuable than a more complex optimizer, but needs budget-matched comparisons.
  - AI feedback pipelines should expose disagreement and uncertainty instead of collapsing everything to one score.
