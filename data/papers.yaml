    direction: distillation
    modalities: [language, agent]
    tags: [on-policy-distillation, skill-distillation, hindsight, agentic-rl]
    key_idea: Extracts hierarchical hindsight skills from completed student trajectories and combines skill-conditioned token guidance with outcome-based reinforcement learning.
    url: https://arxiv.org/abs/2606.26790

  - id: arxiv:2606.17628
    title: "OPD-Evolver: Cultivating Holistic Agent Evolver via On-Policy Distillation"
