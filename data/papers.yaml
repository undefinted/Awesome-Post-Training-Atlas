papers:
  - id: arxiv:2608.16333
    title: "Step-Level On-Policy Distillation: Interpolating Between On-Policy Distillation and Supervised Fine-Tuning"
    date: 2026-08-17
    direction: distillation
    modalities: [language, agent]
    tags: [on-policy-distillation, step-level-guidance, sft, long-horizon]
    key_idea: Corrects student trajectories at the step level, yielding a continuum between supervised fine-tuning and fully on-policy distillation for interactive agents.
    url: https://arxiv.org/abs/2608.16333

  - id: arxiv:2608.14277
    title: "SimpleOPD: Simple Tokenizer-Agnostic On-Policy Distillation for Long-Context Reasoning"
    date: 2026-08-14
    direction: distillation
    modalities: [language, reasoning]
    tags: [on-policy-distillation, tokenizer-alignment, long-context, reasoning]
    key_idea: Aligns shared text spans across mismatched teacher and student tokenizers while stabilizing long-context distillation with reference regularization and termination masking.
    url: https://arxiv.org/abs/2608.14277

  - id: arxiv:2608.05987
    title: "AgentOPSD: Recursive Self-Distillation for Agentic Reinforcement Learning"
    date: 2026-08-06
    direction: distillation
    modalities: [language, agent]
    tags: [on-policy-self-distillation, agentic-rl, temporal-credit, multi-turn]
    key_idea: Recursively aggregates teacher-student token evidence into turn-level Bayesian credit signals for long-horizon agent training without a separate critic or extra rollouts.
    url: https://arxiv.org/abs/2608.05987
    code: https://github.com/ZethWang/AgentOPSD

  - id: arxiv:2607.29494
    title: "Adaptive FastOPD: Progress-Aware Rollout Horizon Expansion for Efficient On-Policy Distillation"
    date: 2026-07-31
    direction: distillation
    modalities: [language, agent]
    tags: [on-policy-distillation, adaptive-horizon, efficiency, multi-turn]
    key_idea: Expands the student rollout horizon only when learning at the current boundary plateaus, reducing wasted long-horizon sampling.
    url: https://arxiv.org/abs/2607.29494

  - id: arxiv:2607.14777
    title: "SEED: Self-Evolving On-Policy Distillation for Agentic Reinforcement Learning"
    date: 2026-07-16
    direction: distillation
    modalities: [language, agent]
    tags: [on-policy-distillation, skill-evolution, hindsight, agentic-rl]
    key_idea: Converts completed on-policy trajectories into evolving hindsight skills and jointly distills their token-level guidance with outcome reinforcement learning.
    url: https://arxiv.org/abs/2607.14777
    code: https://github.com/jinyangwu/SEED

  - id: arxiv:2607.13399
