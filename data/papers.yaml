    modalities: [language, agent]
    tags: [on-policy-distillation, turn-aware, rollout-budgeting, long-horizon]
    key_idea: Combines adaptive rollout-depth budgeting with a progressive turn-normalized loss to focus learning on useful parts of long agent trajectories.
    url: https://arxiv.org/abs/2607.05804

  - id: arxiv:2606.26790
    title: "OPID: On-Policy Skill Distillation for Agentic Reinforcement Learning"
