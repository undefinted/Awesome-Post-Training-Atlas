    direction: distillation
    modalities: [language, reasoning]
    tags: [on-policy-distillation, failure-analysis, regularization, exploration]
    key_idea: Frames on-policy distillation as an exploration catalyst, diagnoses teacher-student mismatch and length exploitation, and studies clipping and log-compression controls.
    url: https://arxiv.org/abs/2607.13399

  - id: arxiv:2607.05804
    title: "TurnOPD: Making On-Policy Distillation Turn-Aware for Efficient Long-Horizon Agent Training"
