- id: arxiv:2608.29616
  title: 'JPO: Juris Policy Optimization for Structured Legal Reasoning in Criminal Judgment Prediction'
  date: '2026-08-30'
  updated: '2026-08-30'
  url: https://arxiv.org/abs/2608.29616
  abstract: Criminal judgment prediction requires models to infer statutory articles, charges, and sentencing outcomes from
    case facts. Unlike standard classification tasks, it involves a structured reasoning process in which statutes should
    be matched with facts, charges should be justified by statutes, and sentencing outcomes should remain consistent with
    charges. Existing approaches optimize final labels, and while some have attempted to evaluate reasoning quality, their
    evaluations are indirect, often relying on LLM-generated rubrics that reflect model-internal preferences rather than the
    inherent logical structure of legal adjudication. We propose Juris Policy Optimization (JPO), a post-training framework
    for structured legal reasoning in Chinese criminal judgment prediction. JPO first uses teacher-generated rationales to
    supervise a standardized four-step reasoning process, and then applies reinforcement learning with a composite reward
    over legal prediction quality, reasoning structure completeness, and cross-step consistency. JPO further introduces token-level
    advantage reweighting and adaptive clipping for legally salient reasoning segments. Experiments on multiple open-source
    languag
