- id: arxiv:2608.30322
  title: Ignorance or Incompetence? Constructing Knowledge-Gated, Verifiable Tasks for LLM Agents
  date: '2026-08-31'
  updated: '2026-08-31'
  url: https://arxiv.org/abs/2608.30322
  abstract: Professional agent tasks often depend on conventions that are absent from public corpora, yet benchmarks rarely
    control whether an agent has access to those conventions. We introduce a knowledge-gated task-construction protocol that
    separates a task instruction from a compact artefact containing private conventions, reference tables, and utility operators.
    Construction-time provenance, byte-identical task instructions across the provided- and withheld-artefact conditions,
    leak audits, and executable witnesses make dependence on the artefact explicit and testable. Across fifteen calibration
    tasks, one frontier agent configuration achieves a 68.0% pass rate with the artefact and 0% without it; on one task, a
    plausible but incorrect artefact also yields 0% across five trials. Deterministic solvers and rule corpora provide exact
    ground truth for structured tasks, while named criterion-level rubrics support outputs that cannot be checked by a single
    executable oracle. A configuration-relative calibration screen retains seven tasks satisfying our five-trial empirical
    knowledge-gating screen. These experiments validate the behavior of the construction protocol; they do not establish that
