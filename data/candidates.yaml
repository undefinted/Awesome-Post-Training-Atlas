- id: arxiv:2608.31046
  title: Does On-Policy Distillation Really Distill? From Noisy Teacher to Self-Improvement
  date: '2026-08-31'
  updated: '2026-08-31'
  url: https://arxiv.org/abs/2608.31046
  abstract: On-policy distillation (OPD) offers dense token-level supervision as an alternative to the sparse outcome-level
    advantages of reinforcement learning with verifiable rewards (RLVR). However, the teacher scores student-generated trajectories
    that are inherently off-policy for it, so the reliability of its supervision, and hence the source of the student's improvement,
    remains unclear. We quantitatively analyze teacher supervision during OPD training and find substantial noise whose prevalence
    increases with teacher scale. Surprisingly, the student policy is insensitive to such noise, converging to comparable
    performance regardless of whether noisy supervision is retained or removed. Does OPD distill at all? By analyzing what
    drives its gains, we find that learning concentrates on low log-probability tokens, and using a single fixed negative
    advantage matches the performance of teacher-provided ones. This suggests that OPD works largely by suppressing low log-probability
    tokens, which requires no teacher. These findings motivate On-Policy Self-Adaptation (OPSA), a supervision-free method
    using entropy-adaptive negative advantages. It assigns stronger learning signals to high-entropy p
