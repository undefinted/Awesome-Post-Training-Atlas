- id: arxiv:2608.30532
  title: 'DiffPDE: Masked Diffusion Language Models as PDE Solver'
  date: '2026-08-31'
  updated: '2026-08-31'
  url: https://arxiv.org/abs/2608.30532
  abstract: Existing approaches for synthesizing Partial Differential Equation (PDE) solvers predominantly rely on autoregressive
    models, yet their global left-to-right decoding incurs substantial redundancy when addressing inherently localized bugs.
    In this work, we challenge this inefficient paradigm and propose DiffPDE, a framework leveraging discrete diffusion language
    models for targeted code repair. By introducing a localized re-masking and infilling strategy, DiffPDE regenerates only
    erroneous regions while preserving correct context, naturally aligning generation with the sparse nature of PDE errors.
    Furthermore, to handle coupled bugs requiring sequential interventions, we present Iterative Debugging GRPO (ID-GRPO),
    a reinforcement learning scheme that enables multi-round debugging within single trajectories via intermediate rewards.
    Experiments on PDEBench show that DiffPDE achieves competitive accuracy, outperforms same-scale AR models, and significantly
    accelerates repair.
