- id: arxiv:2608.31106
  title: 'DreamX-Creator: Democratizing Native Audio-Video Generation at 2K Resolution'
  date: '2026-08-31'
  updated: '2026-08-31'
  url: https://arxiv.org/abs/2608.31106
  abstract: Recent video generators often omit audio or synthesize it in a separate stage, limiting reciprocal modeling of
    visual dynamics and acoustic events. We present DreamX-Creator 1.0, a compact native joint audio-video generation system
    centered on a 7B generator. Conditioned on a first frame and a text prompt, the generator jointly denoises modality-specialized
    audio and video streams. The streams are processed independently in the first half of the network and coupled in the latter
    half through Gated Cross-Modal Attention, whose token- and head-wise output gates modulate each active cross-modal attention-head
    output. A unified Audio-Video Data System constructs and filters temporally coherent clips, produces structured multimodal
    annotations, and organizes clips into capability-oriented data pools. Progressive Joint Training comprises two audio-video
    pre-training stages followed by High-Quality Finetuning. Audio-Video Reinforcement Learning further post-trains the generator
    with Modality-Aware Multimodal Feedback that routes video-, audio-, and cross-modal feedback to the corresponding streams.
