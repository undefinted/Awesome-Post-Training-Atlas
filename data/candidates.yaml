  abstract: Preference optimization is widely used to align large language models with human preferences, but preference-data
    composition may also influence privacy-relevant memorization. We examine whether adding synthetic privacy-preference pairs
    to Direct Preference Optimization (DPO) is associated with lower canary-based memorization signals without modifying the
    objective or introducing a formal privacy mechanism. We propose Privacy-Pressure Preference Mixing (P3M), a data-composition
