- id: arxiv:2608.30325
  title: 'Sequential Trajectories and Simultaneous Blending: Multi-Emotion Modeling for Instruction-Following TTS'
  date: '2026-08-31'
  updated: '2026-08-31'
  url: https://arxiv.org/abs/2608.30325
  abstract: 'Natural-language instructions enable flexible control of synthesized speech, yet emotional TTS systems primarily
    model a single utterance-level affect, leaving multi-emotion control underexplored. We study two complementary multi-emotion
    TTS tasks: emotion trajectory, which spans several ordered affective stages, and emotion blending, in which multiple emotions
    coexist throughout an utterance. These tasks expose a supervision mismatch: supervised fine-tuning (SFT) does not explicitly
    evaluate emotion features, while single-emotion rewards provide neither structure-aware feedback for trajectory completion
    nor pair-aware feedback for blending. We introduce HybridEmo, a post-training framework that initializes both tasks with
    SFT and then aligns the speech-token policy through Group Relative Policy Optimization using a sample-aware hybrid reward.
    For trajectory samples, segment-aligned consistency combines average and weakest-stage evidence to preserve the correctness
    and completeness of prescribed stages. For blending samples, a GMM-based reward combines frame-level support from the
    union of target-emotion anchors in an offline emotion space with an utterance-level weaker-target marg'
