- id: arxiv:2608.30396
  title: Scaffolding Foundation Models into Physical-World Agents Pushes the Frontier of Long-Horizon Navigation
  date: '2026-08-31'
  updated: '2026-09-01'
  url: https://arxiv.org/abs/2608.30396
  abstract: 'Long-horizon physical-world agents must reason over distant goals while grounding decisions in reliable closed-loop
    behavior. Today''s foundation models split these capabilities: vision-language models (VLMs) infer missing information
    and adapt high-level plans but remain brittle and inefficient at repeated navigation grounding, while navigation foundation
    models (NFMs) robustly execute semantic goals but operate as bounded episodes without persistent task-level reasoning.
    We introduce NavMCP, an agentic scaffolding framework that couples a VLM reasoning agent with an NFM executor for long-horizon
    exploration. The VLM decides what evidence to seek, where to search, and when to stop, while the NFM grounds each semantic
    sub-goal into closed-loop navigation. Three channels structure their collaboration: intent translates evidence needs into
    navigation calls, observation converts rollouts into source-grounded trajectory evidence, and memory accumulates findings,
    negative evidence, and unresolved goals across calls. This design turns isolated navigation rollouts into persistent embodied
    interaction without retraining either model. On Embodied Question Answering, NavMCP achieves state-of-'
