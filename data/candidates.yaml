  url: https://arxiv.org/abs/2608.31077
  abstract: 'Outcome-based reinforcement learning provides verified feedback for language-model agents, but assigns trajectory-level
    advantage uniformly to all decisions, yielding coarse credit over long-horizon interactions. On-policy self-distillation
    offers finer supervision by re-evaluating sampled behavior with privileged information (PI) available only during training.
    However, fine-grained supervision is not necessarily fine-grained credit: PI-induced likelihood changes describe how additional
    information alters policy preference, but do not directly determine how an executable action should inherit the verified
    task outcome. This creates a supervision-credit gap. Privileged signals may be irrelevant to the current interaction state,
    operate at a token granularity misaligned with executable decisions, and lack the outcome semantics required for reinforcement.
    We introduce TASPO, which converts privileged supervision into outcome-grounded action credit. TASPO constructs decision-applicable
    PI from verified successful experience, aggregates PI-induced likelihood shifts at the executable-action level, and converts
    relative action support into positive, bounded, mean-preserving weights on th'
