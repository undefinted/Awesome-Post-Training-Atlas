- id: arxiv:2608.30209
  title: 'DICS: Exploring Data Intrinsic Consistency for Visual Instruction Selection'
  date: '2026-08-31'
  updated: '2026-08-31'
  url: https://arxiv.org/abs/2608.30209
  abstract: 'Visual instruction tuning is crucial for advancing the vision-language alignment and instruction-following capabilities
    of Vision-Language Models (VLMs). However, identifying optimal subsets under a fixed ratio constraint from rapidly expanding
    datasets remains a significant bottleneck. While existing methods largely depend on distribution diversity or heuristic
    filtering, they often overlook the internal coherence within individual samples. To bridge this gap, we propose Data Intrinsic
    Consistency (DIC), a self-scoring metric designed to quantify the sample-level inter-component consistency. DIC consists
    of two modules: Visual Information Consistency (VIC), evaluating the alignment between visual content and instructions,
    and Response Information Consistency (RIC), assessing response coherence relative to the instruction. Building upon DIC,
    we introduce Data Intrinsic Consistency Selection (DICS), an adaptive data selection method that optimizes the trade-off
    between high intra-sample consistency and global distributional diversity under varying data budgets. Extensive experiments
    demonstrate that DICS consistently outperforms state-of-the-art methods across diverse dataset scales'
