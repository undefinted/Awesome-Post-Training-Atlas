- id: arxiv:2608.30705
  title: 'VisLens: Single-Pass Interpretable Visual Search for Multimodal LLMs'
  date: '2026-08-31'
  updated: '2026-08-31'
  url: https://arxiv.org/abs/2608.30705
  abstract: 'Multimodal large language models (MLLMs) struggle with fine-grained Visual Search, the task of locating small
    or rare objects in high-resolution images. Existing remedies fall into two families: (1) Training-free methods based on
    attention or confidence scores are accurate but slow, since they require multiple MLLM queries per example. (2) Reinforcement
    Learning (RL) trained tool-use models are faster at inference but opaque, since their tool calls remain uncontrollable
    and hard to interpret. To overcome this, we propose \emph{VisLens} (Visual Focus via Logit Lens), a Visual Search method
    built on the logit lens, which decodes the semantics held in a hidden state by projecting it through the LLM head. VisLens
    further uses a lightweight tuned-lens that maps early hidden states into the final hidden state space, so visual tokens
    can be read out from early layers. These tokens are matched to target words in the query to generate a crop of the relevant
    region, which is fed back in alongside the original image to produce the final answer. The whole process, from decoding
    to the final answer, completes in a single forward pass without repeated queries. VisLens matches or exceeds prior ba'
