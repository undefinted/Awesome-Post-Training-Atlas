- id: arxiv:2608.30935
  title: 'LightNav-0: Eliciting VLM Spatial Intelligence for Generalist Embodied Navigation'
  date: '2026-08-31'
  updated: '2026-08-31'
  url: https://arxiv.org/abs/2608.30935
  abstract: 'Embodied navigation requires agents to translate heterogeneous goals and visual observations into actions across
    tasks, environments, and robot embodiments. Modern vision-language models (VLMs) already encode spatial priors for visual
    grounding, spatial reasoning, and pointing, but these capabilities are rarely elicited directly for robot control. Existing
    navigation systems instead rely on task- or embodiment-specific components, fragmenting perception, reasoning, and action
    while offering limited generalization. Here we present LightNav-0, a compact generalist embodied navigation model that
    elicits the spatial intelligence of a pretrained VLM and aligns it with navigation, without task-specific prediction heads.
    LightNav-0 represents diverse navigation tasks through a unified token interface: dual-channel pointing expresses task-,
    scene-, and embodiment-agnostic spatial intent, while a residual vector-quantized action tokenizer maps this intent to
    precise, embodiment-specific trajectories. Together with temporally aware visual history compression, ER mid-training,
    supervised fine-tuning, and reinforcement learning, this formulation supports instruction following, open-vocabulary'
