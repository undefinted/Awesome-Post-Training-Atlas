- id: arxiv:2608.31035
  title: When Does Predictor-Based RL Align with Human Perception? A Study of Subjective Rewards in Codec-Based Speech Language
    Models
  date: '2026-08-31'
  updated: '2026-08-31'
  url: https://arxiv.org/abs/2608.31035
  abstract: 'Codec-based text-to-speech (TTS) models make language-model post-training applicable to speech generation, but
    it remains unclear when learned perceptual predictors can serve as reinforcement learning rewards without losing alignment
    with human listeners. We study this question with Group Relative Policy Optimization (GRPO) using learned rewards for
    anime-like speaking style, naturalness, likability, and arousal. To prevent perceptual rewards from being optimized through
    transcript drift, we introduce a character error rate (CER) zone constraint and compare policy optimization with Best-of-$N$
    reranking under the same reward gate. Across single-reward runs, each reward primarily improves its own target metric,
    showing that subjective predictors are not interchangeable quality surrogates. Multi-rater A/B tests further show uneven
    human transfer, while a reward-gap analysis separates average transfer from within-axis calibration: signed reward gaps
    significantly predict listener choices in the pooled analysis, whereas residual CER gaps do not, but per-axis calibration
    remains heterogeneous. Best-of-8 is a strong human-level baseline and is not clearly worse than GRPO perceptually, su'
