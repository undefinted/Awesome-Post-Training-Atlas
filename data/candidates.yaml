- id: arxiv:2608.31100
  title: 'S3Gym: Can LLMs Turn Self-Testing and Self-Judging into Self-Improvement?'
  date: '2026-08-31'
  updated: '2026-08-31'
  url: https://arxiv.org/abs/2608.31100
  abstract: 'Large language models (LLMs) increasingly interact with external environments and accumulate substantial behavioral
    experience, yet existing agent benchmarks largely evaluate them as fixed policies. It therefore remains unclear whether
    an agent can actively test its behavior, judge the resulting experience, and use that experience to improve future decisions.
    We introduce \textbf{S\textsuperscript{3}Gym}, an interactive benchmark for evaluating LLM self-improvement through three
    coupled capabilities: \textbf{Self-Testing}, \textbf{Self-Judging}, and \textbf{Self-Improvement}. S$^3$Gym separates
    permissive exploration from strict held-out evaluation and instantiates this protocol in seven text-based games with executable
    environment verifiers. We evaluate three pathways for incorporating interaction experience: direct History ICL, score-conditioned
    Summary Memory, and parameter Training. Our experiments reveal that self-improvement is neither automatic nor uniform.
    Context-level experience improves performance for several model--game pairs, but the most effective pathway depends strongly
    on the task structure: summaries are beneficial when experience can be compressed into reusable'
