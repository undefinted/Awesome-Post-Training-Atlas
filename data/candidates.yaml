- id: arxiv:2608.31079
  title: Sycophantic Agreement Transfers with Neutral Data via Contrastive Preference Optimization
  date: '2026-08-31'
  updated: '2026-08-31'
  url: https://arxiv.org/abs/2608.31079
  abstract: 'Sycophantic agreement refers to a behavior in which language models excessively affirm the user, often at the
    cost of factual accuracy. Although sycophantic agreement is a well-known failure of model alignment, there is limited
    understanding of how it emerges from model training. In this work, we demonstrate that sycophantic agreement can emerge
    as an unintended consequence of widely used contrastive preference optimization objectives. Using the OLMo 3 post-training
    pipeline, we show that, for various pairs of teacher models across three families, there is a strong correlation between
    the log-ratio of the teacher model sycophantic agreement rates and the resulting student model sycophantic agreement rate.
    We further demonstrate that this unintended transfer is not limited to DPO but also occurs across 6 other preference optimization
    objectives. To understand whether this effect can be attributed to particular training examples, we analyze the preference
    data and find that the sycophancy signal is diffused across the entire dataset rather than concentrated in a sparse set
    of examples: each example appears neutral, i.e., there are no explicit instances of sycophantic agreement, and f'
