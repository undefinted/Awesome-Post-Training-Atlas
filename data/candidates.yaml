- id: arxiv:2608.30676
  title: 'MedAgent-R1: Faithfulness-Aware Reinforcement Learning for Evidence-Grounded Medical Reasoning'
  date: '2026-08-31'
  updated: '2026-08-31'
  url: https://arxiv.org/abs/2608.30676
  abstract: 'When medical AI systems hallucinate clinical reasoning, the consequences extend beyond incorrect answers: fabricated
    justifications that superficially reference retrieved evidence can mislead clinicians into unsafe treatment decisions.
    Medical reasoning agents must therefore produce not only correct answers but also faithful justifications that clinicians
    can verify against cited evidence. We identify a systematic failure mode in RL-trained retrieval agents: outcome-only
    rewards improve accuracy while degrading faithfulness, a phenomenon we term confident hallucination. The agent learns
    to answer from parametric memory and backfill plausible but unsupported justifications; citation fabrication rates rise
    from 16.5% to 31.8% even as accuracy improves by 5 points over the supervised baseline. We address this with a faithfulness-gated
    reward design: accuracy credit is conditioned on evidence grounding via a hard gate, complemented by retrieval validity
    and conciseness signals that close exploitation paths unique to agentic retrieval. The resulting system, MedAgent-R1,
    reduces citation fabrication from 31.8% to 4.7% and raises evidence completeness from 58.7 to 82.6 while maintaining 7'
