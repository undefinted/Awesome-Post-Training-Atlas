name: Validate

on:
  push:
  pull_request:
    paths-ignore:
      - data/candidates.yaml
      - data/CANDIDATES.md

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python -m radar.render --check
