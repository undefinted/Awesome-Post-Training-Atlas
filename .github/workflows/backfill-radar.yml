name: Backfill Radar

on:
  workflow_dispatch:
    inputs:
      since:
        description: Earliest first-publication date to inspect
        default: "2024-01-01"
        required: true
      pages_per_query:
        description: arXiv result pages advanced per taxonomy query
        default: "2"
        required: true
      max_new:
        description: Maximum historical candidates to enrich per run
        default: "300"
        required: true
  schedule:
    - cron: "47 3 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Search academic indexes directly
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          SINCE: ${{ inputs.since || '2024-01-01' }}
          PAGES: ${{ inputs.pages_per_query || '2' }}
          MAX_NEW: ${{ inputs.max_new || '300' }}
        run: python -m radar.backfill --since "$SINCE" --pages-per-query "$PAGES" --max-new "$MAX_NEW"
      - name: Validate discovery inventory
        run: |
          python -m radar.render
          python -m unittest discover -s tests
          python -m radar.render --check
      - name: Create backfill pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "radar: cross-check historical paper indexes"
          branch: radar/weekly-backfill
          delete-branch: true
          title: "Radar: weekly historical coverage backfill"
          body: |
            Direct academic-index historical discovery update. Candidates are balanced across taxonomy directions, displayed with a provisional marker in the README, and require curator review before promotion to the curated dataset.
          labels: radar,candidates,backfill
