name: Direction-Month Coverage Radar

on:
  workflow_dispatch:
    inputs:
      year:
        description: Optional year; blank selects the newest unaudited month
        required: false
      month:
        description: Optional month number when year is supplied
        required: false
      max_per_cell:
        description: Maximum arXiv results inspected per direction-month cell
        default: "1000"
        required: true
  schedule:
    # GitHub Actions uses UTC; 00:30 UTC = 08:30 China Standard Time (UTC+8).
    - cron: "30 0 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Search direction-month cells directly on arXiv
        env:
          YEAR: ${{ inputs.year }}
          MONTH: ${{ inputs.month }}
          MAX_PER_CELL: ${{ inputs.max_per_cell || '1000' }}
        run: |
          if [ -z "$YEAR" ]; then
            python -m radar.monthly --auto --max-per-cell "$MAX_PER_CELL"
          elif [ -z "$MONTH" ]; then
            python -m radar.monthly --year "$YEAR" --max-per-cell "$MAX_PER_CELL"
          else
            python -m radar.monthly --year "$YEAR" --month "$MONTH" --max-per-cell "$MAX_PER_CELL"
          fi
      - name: Generate and validate all views
        run: |
          python -m radar.labels
          python -m radar.render
          python -m radar.coverage
          python -m radar.site
          python -m unittest discover -s tests
          python -m radar.labels --check
          python -m radar.render --check
          python -m radar.coverage --check
          python -m radar.site --check
      - name: Create coverage pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            COVERAGE.md
            README.md
            LABELS.md
            data/**
            directions/**
            docs/**
          commit-message: "radar: audit direction-month academic coverage"
          branch: radar/monthly-coverage-${{ inputs.year || 'auto' }}-${{ inputs.month || 'grid' }}
          delete-branch: true
          title: "Radar: direction-month coverage ${{ inputs.year || 'auto' }}-${{ inputs.month || 'grid' }}"
          body: |
            Direct arXiv direction × month coverage audit. Review `data/monthly_audit.yaml` for exact cell queries, limits, counts, completion, and errors. All newly visible entries remain explicitly marked as discovery candidates.
          labels: radar,candidates,backfill
