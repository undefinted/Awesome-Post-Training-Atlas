name: Paper Radar

on:
  workflow_dispatch:
    inputs:
      days:
        description: Lookback window in days
        default: "2"
        required: true
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover papers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          RADAR_DAYS: ${{ inputs.days || '2' }}
        run: python -m radar.main --days "$RADAR_DAYS"
      - name: Validate generated candidates
        run: |
          python -m radar.labels
          python -m radar.render
          python -m radar.site
          python -m unittest discover -s tests
          python -m radar.labels --check
          python -m radar.render --check
          python -m radar.coverage --check
          python -m radar.site --check
      - name: Create candidate pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "radar: update paper candidates"
          branch: radar/daily-candidates
          delete-branch: true
          title: "Radar: daily post-training paper candidates"
          body-path: data/CANDIDATES.md
          labels: radar,candidates
